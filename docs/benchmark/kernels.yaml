memilio/secir: [rust, jax] # Rust 2.1 ms, JAX 2.1 ms, Numba 2.3 ms, JAX on a GPU 24 ms
memilio/secir_ageres: [rust] # Rust 2.1 ms, Numba 2.4 ms, JAX 3.1 ms, JAX on a GPU 14 ms
