format:
  html:
    from: markdown+gfm_auto_identifiers # So links to headings work here as they do on GitHub
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    mainfont: Raleway
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: scroll
    grid:
      body-width: 1100px
    highlight-style: github
    filters:
      - _filters/links.lua
