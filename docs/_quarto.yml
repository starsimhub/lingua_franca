      - href: design/index.qmd
        text: Design
      - href: models/index.qmd
        text: Models
      - href: webapp/index.qmd
        text: Compare
      - href: admin/implementation.md
        text: Status
      - href: costing/README.md
        text: Cost modeling
    tools:
      - icon: github
        href: https://github.com/starsimhub/lingua_franca_design

  sidebar:
