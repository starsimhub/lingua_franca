    starsim: the Optuna wrapper; evaluation with common random numbers; fit.sim
    odin: the likelihood beside its quantity; particle MCMC; wrapping inference engines rather than bundling them
    summer2: exact gradients through the ODE with JAX
    epydemix: ABC-SMC for stochastic compartmental models
    metacast: Latin hypercube sampling and PRCC as sim.sensitivity()
    siminf: ABC and particle methods for stochastic models
    epiworld: likelihood-free fitting of agent-based models
    epymorph: particle-filter fitting
    other: Covasim (normalized absolute error, data matched by column name); pomp (iterated filtering); BlackJAX, SciPy, and Optuna as the engines
    new: the fitting method chosen from the model and printed; sim.fit() with nothing extra declared; a posterior always asked for by name; detecting unidentifiable products; comparing models by held-out prediction, with one measure for all

Model as code and interop:
  shares: {starsim: 25, camdl: 6, emulsion: 5, memilio: 3, epipack: 2, atomica: 2, siminf: 2, other: 25, new: 30}
  notes:
    starsim: the Python script as the model; a saved sim with its version; to_json for results
    camdl: a flat list of named flows between the source and the run; saying what cannot be carried over
    emulsion: its models as the main import test
    memilio: its SBML reader, the one working format-to-framework importer in the review
    epipack: spontaneous versus contact-mediated kinds, which sort a rate on import
    atomica: named combinations of states, kept by name in the code an import writes
    siminf: variables that are not people
    other: SBML (the import and export format, and why every export must list what it lost); MIRA (import through one meta-model)
    new: one reader per framework, then one path through generated code that is the user's to keep; rules for sorting a general rate into a transition; an incomplete import that runs, lists what is missing, and hands it to an AI assistant; per-declaration lossy-export warnings; the vignette test

Deterministic compartmental (ODE):
  shares: {starsim: 19, epipack: 12, camdl: 10, summer2: 10, odin: 8, memilio: 8, atomica: 3, other: 3, new: 27}
  notes:
    starsim: the disease vocabulary and Sim API, now solved exactly; kernels in Numba and Rust
    epipack: one model run as ODE or stochastic; printing the equations
    camdl: the same model text on ODE and stochastic backends; Erlang stages
    summer2: the model run in JAX for speed and gradients
    odin: generating the right-hand side from the model graph; delay() and its comparison for fixed delays
    memilio: LCT models as the precedent for Erlang stages; IDE models for dwell times as they are (solver='ide')
    atomica: the transition matrix view
    other: MIRA; the linear chain trick; the renewal equation
    new: solver='auto' choosing ODE or agents and saying why; homogeneous mixing with no /N; automatic Erlang stages with approx=; a conveyor of whole steps for a fixed delay; a branching process as a switch on the same model (branching=True)

Stochastic compartmental:
  shares: {camdl: 16, starsim: 16, siminf: 16, epipack: 11, odin: 3, eon: 3, other: 12, new: 23}
  notes:
    camdl: Gillespie, chain-binomial, and ODE from one text; runs paired with common random numbers
    starsim: a sim is one trajectory and a MultiSim many; states and modifiers reused across solvers; kernels in Numba and Rust
    siminf: continuous time, run place by place; a reservoir coupled to discrete counts, as expected values; resampling onto an output grid
    epipack: time-varying rates in every mode, with thinning Gillespie
    odin: chain binomials in discrete time; many runs at once
    eon: Gillespie as the exact method, and its name
    other: PyRoss (Gillespie and tau-leaping side by side); Catalyst.jl (per-reaction hybrids, deferred); branching-process tools such as epichains
    new: exact, tau-leaping, and chain-binomial solvers from one flat program, with the same draws in every kernel; validity checks as notes; depletion turned off for any declared model (branching=True)

Agent-based:
  shares: {starsim: 64, individual: 6, laser: 4, epiworld: 3, emod: 3, siminf: 3, epihiper: 1, other: 1, new: 15}
  notes:
    starsim: the whole architecture (per-agent arrays, UIDs, one module abstraction, the ordered loop, select-thin-act, scheduled events, per-agent common random numbers)
    individual: select-thin-act as the core operation; scheduled targeted events
    laser: Numba for the loop at the heart of a step (ss.jit); queue-based scheduling; optional preallocation
    epiworld: multiplicative, non-overwriting modifiers
    emod: Individual Properties as the agent form of a dimension
    siminf: counts kept alongside individuals
    epihiper: set algebra over agents
    other: Mesa AgentSet
    new: one declaration with an agent realization; every dimension as an agent property; count states inside an agent model; a joint draw for competing hazards; half-step rates, so agents agree with compartments; agents made only for the infected in a branching process

Solver choice and paradigm conversion:
  shares: {emulsion: 12, starsim: 12, epipack: 10, camdl: 10, memilio: 10, summer2: 6, siminf: 1, other: 7, new: 32}
  notes:
    emulsion: switching paradigm with one word on the same model; its models as agreement tests
    starsim: the agent solver and the Sim API that solver= hangs off; kernels in Numba and Rust, kept in step
    epipack: one process list run deterministically, stochastically, and on networks
    camdl: several backends from one text; always saying when something cannot run; dt-convergence audit
    memilio: the four axes (aggregation, stochasticity, dwell time, space); Erlang stages and IDE as the dwell-time conversions
    summer2: JAX as the path for large ODE models and for gradients
    siminf: one small vocabulary across compartmental and network forms
    other: Catalyst.jl; MIRA and SBML; the partner-change approximation of networks
    new: solver='auto' never approximating mixing or individuals; the standard approximation with a one-line note; describe() saying what can run and why; the engine chosen from the model's size alone, so a seed always gives the same run
