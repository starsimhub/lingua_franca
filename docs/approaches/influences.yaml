Randomness and reproducibility:
  shares: {starsim: 70, camdl: 8, epidemics: 2, new: 20}
  notes:
    starsim: per-distribution random number streams; common random numbers keyed on agent slots; version info saved with sims, which with the code is the record of a run
    camdl: the dt-convergence audit (check_dt); paired scenarios
    epidemics: keeping seeds across scenarios
    new: stream names from model paths so every spelling draws the same numbers; one draw from one uniform in every solver, so a stochastic compartmental run draws the same stepped or whole; a stated list of which modules keep common random numbers

Calibration and inference:
  shares: {camdl: 19, starsim: 14, odin: 8, summer2: 7, epydemix: 5, metacast: 5, siminf: 4, epiworld: 1, epymorph: 1, other: 10, new: 26}
