# What the lingua franca owes to each framework, by area: a rough judgment from reading
# best-practices/ and design/ against approaches/ (2026-10-30). Shares in each area add to 100.
# "new" is what no framework did first; "other" is frameworks without a review here (named in the note).
# A framework cited only as a counterexample, or for an approach that was rejected, gets nothing.
# Drawn by influences.py on approaches/influences.qmd.

Principles, defaults and errors:
  shares: {camdl: 20, starsim: 20, atomica: 4, epidemics: 3, emulsion: 3, odin: 3, summer2: 1, epydemix: 1, other: 6, new: 39}
  notes:
    camdl: error messages as part of the language (naming the rule, quoting the expression, giving the fix); always saying what a solver cannot run; documents shipped with the version
    starsim: plain Python and step() as first class, the ordered inspectable loop, define_pars name checking, the one module lifecycle
    atomica: the benchmark that non-programmers can define a full model
    epidemics: trading flexibility for ease of use, aimed at practitioners
    emulsion: a model that can be discussed with non-modelers; exponential as the assumed dwell time
    odin: showing what was resolved, which motivates printing every guess
    summer2: the error on a partial stratification
    epydemix: AGENT.md as a contract for AI tools
    other: rustc/Elm-style diagnostics; Kendrick's separation of concerns
    new: guess the default and print it ([guessed] in describe()); approximate rather than refuse, within a small declared subset; one vocabulary at several lengths; every core feature has to earn its place in the library; lines and time measured against each framework's own examples

Model structure:
  shares: {camdl: 19, starsim: 19, siminf: 7, epihiper: 6, emulsion: 6, memilio: 3, epipack: 3, atomica: 3, odin: 2, epydemix: 2, eon: 1, metacast: 1, summer2: 1, tlo: 3, other: 2, new: 22}
  notes:
    camdl: the model as data; named transitions with rates after '@'; rates written as the whole flow; incidence per transition; Erlang sub-stages
    starsim: declared states on ss.Disease modules, init_prev, rel_sus/rel_trans, sample-and-schedule dwell times, automatic results, modules written as code (ss.Infection), ss.Pregnancy
    siminf: rates written as the whole flow; compartments versus continuous variables, the precedent for states that are counts
    epihiper: a dwell-time distribution per transition; susceptibility and infectivity as properties of a state
    emulsion: interchangeable rate, probability, and duration keys; minimum stays (after=) and litters
    memilio: LCT models as the precedent for Erlang staging
    epipack: ODEs derived from declared transitions (equations())
    atomica: the transition matrix as a tabular view of the model
    odin: delay() as the precedent for a fixed delay
    epydemix: mediated transitions that imply the source and the total, as a bare state does
    eon: spontaneous and contact-mediated processes as two kinds
    metacast: infected and infectious states as distinct sets
    summer2: named flows as the precedent for telling transitions apart by kind
    tlo: LinearModel (regressions as rates, here ss.ppl expressions)
    other: MIRA (natural versus controlled conversions); sympy.symbols idiom for ss.states(); epidemik's R0 from the structure
    new: one transition kind, typed by whether its rate mentions a state; the >> and @ spelling; ss.null; names taken from variables; what counts as acquisition, derived; the first state, guessed; declared and coded parts in one class; events and clocks as expressions

