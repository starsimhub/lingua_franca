    starsim: dimensions as per-agent arrays on sim.people; results by group from modules written as code
    metacast: every partition, space included, as one operation; transfers between levels (ss.transfer)
    emod: Individual Properties as agent attributes that interventions target
    flepimop: compartments as a product of named axes
    epihiper: traits as agent attributes that interventions target
    other: MIRA, Kendrick, pandas (inplace); FPsim (parity, as a counter)
    new: agent properties and compartment axes as one declaration; sim-level versus disease-level stratification; results indexed by dimension; counters; part of the model stratified (where=), with people outside it having no level

Strains and immunity:
  shares: {other: 38, starsim: 17, summer2: 12, flepimop: 3, epiworld: 3, new: 27}
  notes:
    other: HPVsim (genotypes with courses of their own, the immunity matrix and its sum rule, severity immunity); tbsim (sets of strains carried, resistance on treatment); Covasim (variants introduced on a date)
    starsim: several diseases in one sim, each with its own states and random numbers; rel_sus and rel_trans; a disease written as code with strains
    summer2: strain stratification that restructures the force of infection
    flepimop: variants as a named axis
    epiworld: things an agent carries that make it transmit, as a primitive
    new: one concept, whether each state is shared or each strain's own; sets carried as levels of a dimension; one ss.immunity, by what protects; the same declaration under every solver, or a refusal that says why

Geospatial and metapopulation:
  shares: {epymorph: 21, laser: 17, siminf: 16, metacast: 7, starsim: 8, epydemix: 3, flepimop: 3, other: 8, new: 17}
  notes:
    epymorph: disease, movement, and geography as separate declarations; commuting versus migration; named geography sources
    laser: named mobility generators (gravity, radiation); moving force of infection between patches (kind='force')
    siminf: a movement register of dated transfer events, with moves between states; per-node data and environmental state; running each place on its own
    metacast: metapopulation as the same operation as stratification; per-subpopulation parameters
    starsim: patch as an agent property; MixingPool grouped by patch; bundled and fetched geodata
    epydemix: bundled populations and contact matrices for 400+ places
    flepimop: the visit form of movement, where visitors are exposed but expose no one (kind='visit')
    other: the standard time-share commuting formulation; the textbook commuter model with finite return rates
    new: space as an ordinary dimension that may have no movement; a pluggable geography source; contact matrices acting within each place under every solver

Mixing and networks:
  shares: {starsim: 38, epimodel: 19, siminf: 3, epydemix: 4, metacast: 2, summer2: 2, camdl: 2, other: 12, new: 18}
  notes:
    starsim: networks and mixing pools behind networks=; layers; beta per network; the per-edge transmission probability; ss.SexualNet
    epimodel: networks specified by target statistics (ss.DegreeNet); concurrency and limits on partners; net.check; partnerships kept separate from acts; match=
    siminf: an environmental reservoir driving transmission
    epydemix: household, school, and work layers with bundled contact matrices
    metacast: relative infectiousness of states
    summer2: a mixing matrix over strata, required to be complete
    camdl: the missing /N error, which the library supplying /N answers
    other: the standard partner-change model of sexually transmitted infections; published age contact matrices; Covasim layers; the textbook vector model
    new: a bare state means contact while I.n is a count; homogeneous mixing by default with the textbook beta; one force-of-infection formula; sides and named directions on a network

Interactions and effects:
  shares: {starsim: 35, vivarium: 25, epidemics: 6, epiworld: 3, individual: 3, memilio: 2, epydemix: 1, other: 1, new: 24}
  notes:
    starsim: one module abstraction; connectors and step() code; the ordered loop; deferred removal
    vivarium: value pipelines (a base value plus modifiers combined by a rule, restored automatically)
    epidemics: the combination rule as a stated modeling decision; add= as the alternative
    epiworld: tools as bundles of multiplicative effects
    individual: resolving competing hazards jointly and deferring updates; set algebra behind conditions
    memilio: a minimum stay once a measure is on, which became hold=
    epydemix: dated contact reductions
    other: Mesa (order of activation as a modeling decision)
    new: one-line ss.modify over any named quantity; reading the base and current_value() for the value used; frac= and route= for protection used in some acts; refusing at build time what nothing reads; diseases tracked jointly when a condition crosses them

Interventions:
  shares: {starsim: 33, emod: 17, atomica: 8, epihiper: 5, memilio: 3, epimodel: 3, flepimop: 2, camdl: 2, epydemix: 2, individual: 2, tlo: 3, other: 6, new: 14}
  notes:
    starsim: the product and delivery split; eligibility as a function of the sim; routine versus campaign delivery; screening, triage, and treatment as modules
    emod: efficacy kept separate from waning; efficacy by acquisition, transmission, and mortality; capacity; deliveries triggered by events that others can listen for
    atomica: a unit cost on each intervention; programs that move parameters by spending, and reallocating a budget between them (ss.fitting.optimize)
    epihiper: triggers (close schools when cases pass a threshold)
    memilio: dampings on contacts; measures switched on by incidence in each place
    epimodel: the scenario table shape behind ss.change
    flepimop: a parameter, a time window, a scope, and a value as the shape of a change
    camdl: scenarios paired against a baseline with common random numbers
    epydemix: dated contact reductions, which became ss.modify
    individual: set algebra for eligibility
    tlo: care as a request that capacity can refuse
    other: Covasim's change_beta (ss.change) and contact tracing; HPVsim's screen, triage, and treat cascade; malariasim's box-shaped waning and product coverage
    new: deliver= with a capacity cap; steps as peers, triggered by events; a memory of every event (.ever, .count, .since); coverage-then-capacity; the outcome, intervention, or state rule

