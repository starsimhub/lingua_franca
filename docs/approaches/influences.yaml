    camdl: dimension checking of rate expressions when the model is built, including what lands in a slot
    odin: transparency about the rate-to-probability conversion
    epimodel: time counted in steps when nothing has a unit
    siminf: time counted in steps when nothing has a unit
    epiworld: time counted in steps when nothing has a unit
    individual: time counted in steps when nothing has a unit
    laser: time counted in steps when nothing has a unit
    new: bare numbers typed by their slot and given the sim's unit; the unit-inference rules; timesteps as the fallback; dwell times rounded to whole steps at random, keeping the mean

